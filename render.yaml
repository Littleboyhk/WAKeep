# =============================================================================
# Render Blueprint Specification for wakeep
# Deploy 24/7 on Render Free Tier
# =============================================================================
services:
  - type: web
    name: wakeep
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: VAULT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_ID
        value: main_session
